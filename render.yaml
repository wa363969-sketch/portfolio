services:
  - type: web
    name: shabeer-ahmed-portfolio
    env: python
    buildCommand: "pip install -r server/requirements.txt && cd client && npm install && npm run build"
    startCommand: "gunicorn server.app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    databaseName: portfoliodb
    user: shabeer
